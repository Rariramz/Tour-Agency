# Development database only. Credentials come from the ignored backend/.env.
name: tour-agency-portfolio-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:?Run node scripts/setup-local.mjs first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup-local.mjs first}
      POSTGRES_DB: ${DB_NAME:?Run node scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
