name: CI

on:
  push:
    branches: [main, develop, portfolio-refresh]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tour_agency
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: tour_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tour_agency -d tour_agency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: tour_agency
      DB_PASSWORD: test-only-password
      DB_NAME: tour_agency_test
      JWT_SECRET: test-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Test and build backend
        run: npm test -- --runInBand && npm run test:e2e -- --runInBand && npm run build
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test, type-check and build frontend
        run: npm test -- --runInBand && npm run typecheck && npm run build:prod
        working-directory: frontend
